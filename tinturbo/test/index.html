<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Tinturbo Teste</title>

		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #1a1436;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="manifest" href="index.manifest.json">

	<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tinturbo Teste">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#1a1436">
<script>
// Trecho do Tinturbo posto na página pelo tools/web/prepare_page.py: som, instalação e diagnóstico (?diag no endereço).
(function () {
	'use strict';
	const isDiag = new URL(location.href).searchParams.has('diag');
	const isTest = 'test' === 'test';
	const contexts = [];
	const report = { starts: 0, resumes: 0, error: '', peak: 0 };

	// --- Teste e produção separados ---

	if (isTest) {
		// Mesmo endereço, dados salvos próprios: o Godot sempre usa o banco "/userfs".
		const open = IDBFactory.prototype.open;
		IDBFactory.prototype.open = function (name, ...rest) {
			return open.call(this, name === '/userfs' ? '/userfs-test' : name, ...rest);
		};
		window.addEventListener('DOMContentLoaded', function () {
			const badge = document.createElement('div');
			badge.textContent = 'TESTE 2026-11-25 12:05';
			badge.style.cssText = 'position:fixed;left:6px;bottom:4px;z-index:8;color:#fff;opacity:.7;font:10px monospace;pointer-events:none;text-shadow:0 0 2px #000';
			document.body.append(badge);
		});
	}

	// --- Som ---

	// No iPhone, sem isto o modo silencioso cala o jogo (só existe a partir do iOS 16.4).
	function askForPlayback() {
		try {
			if (navigator.audioSession) {
				navigator.audioSession.type = 'playback';
			}
		} catch (e) {
			report.error = 'audioSession: ' + e;
		}
	}
	askForPlayback();

	const NativeContext = window.AudioContext || window.webkitAudioContext;
	if (NativeContext) {
		class TrackedContext extends NativeContext {
			constructor(...args) {
				super(...args);
				contexts.push(this);
			}
		}
		window.AudioContext = TrackedContext;
	}

	// O iPhone deixa o som parado ("suspended" ou "interrupted") até um toque, e de novo depois de trocar de app.
	function unlock() {
		for (const context of contexts) {
			if (context.state !== 'running' && context.state !== 'closed') {
				report.resumes++;
				askForPlayback();
				context.resume().catch(function (e) { report.error = 'resume: ' + e; });
			}
		}
	}
	for (const name of ['touchend', 'pointerup', 'click', 'keydown']) {
		window.addEventListener(name, unlock, { capture: true, passive: true });
	}
	document.addEventListener('visibilitychange', function () {
		if (!document.hidden) {
			unlock();
		}
	});

	// O Godot recomeça a música só depois do fim dela (15 a 30 ms de silêncio). Aqui ela repete sem emenda:
	// só as músicas passam de 10 segundos.
	if (window.AudioBufferSourceNode) {
		const start = AudioBufferSourceNode.prototype.start;
		AudioBufferSourceNode.prototype.start = function (...args) {
			report.starts++;
			if (this.buffer && this.buffer.duration > 10) {
				this.loop = true;
			}
			return start.apply(this, args);
		};
	}

	// --- Instalação ---

	let installPrompt = null;
	window.addEventListener('beforeinstallprompt', function (event) {
		event.preventDefault();
		installPrompt = event;
	});
	function isInstalled() {
		return navigator.standalone === true || ['standalone', 'fullscreen', 'minimal-ui'].some(function (mode) {
			return matchMedia('(display-mode: ' + mode + ')').matches;
		});
	}
	function isIos() {
		// O iPad se apresenta como Mac.
		return /iPhone|iPad|iPod/.test(navigator.userAgent) || (/Mac/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
	}
	window.tinturboInstall = {
		// installed, prompt (o navegador instala sozinho), safari, ios (outro navegador do iPhone) ou other.
		kind: function () {
			if (isInstalled()) {
				return 'installed';
			}
			if (installPrompt) {
				return 'prompt';
			}
			if (isIos()) {
				return /CriOS|FxiOS|EdgiOS|OPiOS|OPT\/|GSA\//.test(navigator.userAgent) ? 'ios' : 'safari';
			}
			return 'other';
		},
		run: function () {
			if (installPrompt) {
				installPrompt.prompt();
				installPrompt = null;
			}
		},
	};

	// --- Diagnóstico ---

	if (!isDiag) {
		return;
	}
	const connect = AudioNode.prototype.connect;
	let analyser = null;
	AudioNode.prototype.connect = function (target, ...rest) {
		if (target instanceof AudioDestinationNode) {
			if (!analyser) {
				analyser = this.context.createAnalyser();
			}
			if (analyser.context === this.context) {
				connect.call(this, analyser);
			}
		}
		return connect.call(this, target, ...rest);
	};
	window.addEventListener('error', function (event) { report.error = event.message; });
	function beep() {
		const context = contexts[0];
		if (!context) {
			return;
		}
		context.resume();
		const tone = context.createOscillator();
		const volume = context.createGain();
		volume.gain.value = 0.4;
		tone.connect(volume);
		volume.connect(context.destination);
		tone.start();
		tone.stop(context.currentTime + 0.6);
	}
	window.addEventListener('DOMContentLoaded', function () {
		const box = document.createElement('div');
		box.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:9;background:#000c;color:#fff;font:12px/1.35 monospace;padding:8px;white-space:pre-wrap;word-break:break-word';
		const text = document.createElement('div');
		const button = document.createElement('button');
		button.textContent = 'TOCAR BIP';
		button.style.cssText = 'font-size:18px;padding:8px 16px;margin-top:6px';
		button.addEventListener('click', beep);
		box.append(text, button);
		document.body.append(box);
		setInterval(function () {
			if (analyser) {
				const samples = new Float32Array(analyser.fftSize);
				analyser.getFloatTimeDomainData(samples);
				report.peak = Math.max(report.peak * 0.9, ...samples.map(Math.abs));
			}
			const audio = contexts.map(function (c) { return c.state + ' ' + c.sampleRate + ' t=' + c.currentTime.toFixed(1); }).join(' | ');
			text.textContent = 'Versão 2026-11-25 12:05 (test)\n' + navigator.userAgent
				+ '\nAbertura: ' + window.tinturboInstall.kind() + '  Tela: ' + innerWidth + 'x' + innerHeight + ' @' + devicePixelRatio
				+ '\nÁudio: ' + (audio || 'nenhum')
				+ '\nSessão: ' + (navigator.audioSession ? navigator.audioSession.type + ' / ' + navigator.audioSession.state : 'não existe')
				+ '\nSons: ' + report.starts + '  Pedidos: ' + report.resumes + '  Volume na saída: ' + report.peak.toFixed(3)
				+ '\nErro: ' + (report.error || 'nenhum');
		}, 250);
	});
}());
</script>
</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--false" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":25734620,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
