		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #1a1436;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="manifest" href="index.manifest.json">

	<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tinturbo Teste">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#1a1436">
<script>
// Trecho do Tinturbo posto na página pelo tools/web/prepare_page.py: som, instalação e diagnóstico (?diag no endereço
// ou, na versão de teste, um toque no selo TESTE).
(function () {
	'use strict';
	const isDiag = new URL(location.href).searchParams.has('diag');
	const isTest = 'test' === 'test';
	const contexts = [];
	const report = { starts: 0, resumes: 0, revives: 0, returns: 0, error: '', peak: 0 };

	// --- Teste e produção separados ---

	if (isTest) {
		// Mesmo endereço, dados salvos próprios: o Godot sempre usa o banco "/userfs".
		const open = IDBFactory.prototype.open;
		IDBFactory.prototype.open = function (name, ...rest) {
			return open.call(this, name === '/userfs' ? '/userfs-test' : name, ...rest);
		};
		window.addEventListener('DOMContentLoaded', function () {
			const badge = document.createElement('div');
			badge.textContent = 'TESTE 2026-11-25 12:47';
			badge.style.cssText = 'position:fixed;left:6px;bottom:4px;z-index:8;color:#fff;opacity:.7;padding:6px;font:10px monospace;text-shadow:0 0 2px #000';
			badge.addEventListener('click', toggleDiagnostics);
			document.body.append(badge);
		});
	}

	// --- Som ---

	// No iPhone, sem isto o modo silencioso cala o jogo (só existe a partir do iOS 16.4).
	function askForPlayback() {
		try {
			if (navigator.audioSession) {
				navigator.audioSession.type = 'playback';
			}
		} catch (e) {
			report.error = 'audioSession: ' + e;
		}
	}
	askForPlayback();

	const NativeContext = window.AudioContext || window.webkitAudioContext;
	if (NativeContext) {
		class TrackedContext extends NativeContext {
			constructor(...args) {
				super(...args);
				contexts.push(this);
			}
		}
		window.AudioContext = TrackedContext;
	}

	// O iPhone deixa o som parado ("suspended" ou "interrupted") até um toque. Depois de trocar de app, pode
	// também dizer que está tocando ("running") com o relógio do som parado: por isso ele é medido.
	const CHECK_MS = 400;
	const RETRY_MS = 900;
	const clocks = new Map();
	let lastTry = 0;
	let silence = null;

	function isHealthy(context) {
		const clock = clocks.get(context);
		return context.state === 'running' && (!clock || !clock.isFrozen);
	}

	function resume(context) {
		report.resumes++;
		context.resume().catch(function (e) { report.error = 'resume: ' + e; });
	}

	// Um som mudo num elemento comum faz o iPhone reabrir a saída de áudio.
	function playSilence() {
		if (!silence) {
			const size = 800;
			const view = new DataView(new ArrayBuffer(44 + size));
			const text = function (at, value) {
				for (let i = 0; i < value.length; i++) {
					view.setUint8(at + i, value.charCodeAt(i));
				}
			};
			text(0, 'RIFF');
			view.setUint32(4, 36 + size, true);
			text(8, 'WAVEfmt ');
			view.setUint32(16, 16, true);
			view.setUint16(20, 1, true);
			view.setUint16(22, 1, true);
			view.setUint32(24, 8000, true);
			view.setUint32(28, 8000, true);
			view.setUint16(32, 1, true);
			view.setUint16(34, 8, true);
			text(36, 'data');
			view.setUint32(40, size, true);
			for (let i = 0; i < size; i++) {
				view.setUint8(44 + i, 128);
			}
			silence = new Audio(URL.createObjectURL(new Blob([view], { type: 'audio/wav' })));
		}
		silence.play().catch(function () {});
	}

	// Em todo toque: religa o que estiver parado. O travado é desligado e ligado de novo.
	function unlock() {
		const now = performance.now();
		const broken = contexts.filter(function (context) { return context.state !== 'closed' && !isHealthy(context); });
		if (broken.length === 0 || now - lastTry < RETRY_MS) {
			return;
		}
		lastTry = now;
		askForPlayback();
		for (const context of broken) {
			if (context.state === 'running') {
				report.revives++;
				playSilence();
				context.suspend().catch(function () {});
			} else if (report.returns > 0) {
				playSilence();
			}
			resume(context);
		}
	}
	for (const name of ['touchend', 'pointerup', 'click', 'keydown']) {
		window.addEventListener(name, unlock, { capture: true, passive: true });
	}

	// Sair desligando evita que o iPhone corte o som no meio e o deixe travado.
	function onLeave() {
		for (const context of contexts) {
			if (context.state === 'running') {
				context.suspend().catch(function () {});
			}
		}
	}
	function onReturn() {
		report.returns++;
		lastTry = 0;
		clocks.clear();
		unlock();
	}
	document.addEventListener('visibilitychange', function () {
		if (document.hidden) {
			onLeave();
		} else {
			onReturn();
		}
	});
	window.addEventListener('pageshow', function (event) {
		if (event.persisted) {
			onReturn();
		}
	});
	setInterval(function () {
		if (document.hidden) {
			return;
		}
		for (const context of contexts) {
			const clock = clocks.get(context);
			const isRunning = context.state === 'running';
			// Duas medidas seguidas sem andar: uma só pode ser um engasgo.
			const stalls = isRunning && clock && context.currentTime <= clock.time ? clock.stalls + 1 : 0;
			clocks.set(context, { time: context.currentTime, stalls: stalls, isFrozen: stalls >= 2 });
		}
	}, CHECK_MS);

	// O Godot recomeça a música só depois do fim dela (15 a 30 ms de silêncio). Aqui ela repete sem emenda:
	// só as músicas passam de 10 segundos.
	if (window.AudioBufferSourceNode) {
		const start = AudioBufferSourceNode.prototype.start;
		AudioBufferSourceNode.prototype.start = function (...args) {
			report.starts++;
			if (this.buffer && this.buffer.duration > 10) {
				this.loop = true;
			}
			return start.apply(this, args);
		};
	}

	// --- Atualização ---

	// Pedida pelo jogo quando o servidor já tem regras novas. Com versão nova no site, troca para ela; sem
	// achar, descarta a cópia guardada (só a deste jogo) e baixa tudo de novo. Sem internet, não mexe em nada.
	window.tinturboUpdate = async function () {
		const wait = function (ms) { return new Promise(function (done) { setTimeout(done, ms); }); };
		const registration = 'serviceWorker' in navigator ? await navigator.serviceWorker.getRegistration() : null;
		try {
			const page = await fetch('index.html?update=' + Date.now(), { cache: 'no-store' });
			if (!page.ok) {
				return;
			}
		} catch (e) {
			return;
		}
		if (registration) {
			await registration.update().catch(function () {});
			for (let i = 0; i < 25 && (registration.installing || registration.waiting); i++) {
				if (registration.waiting) {
					navigator.serviceWorker.addEventListener('controllerchange', function () { location.reload(); });
					registration.waiting.postMessage('claim');
					return;
				}
				await wait(200);
			}
			for (const name of await caches.keys()) {
				if (name.startsWith('TinturboTest-sw-cache-')) {
					await caches.delete(name);
				}
			}
			await registration.unregister();
		}
		location.reload();
	};

	// --- Instalação ---

	let installPrompt = null;
	window.addEventListener('beforeinstallprompt', function (event) {
		event.preventDefault();
		installPrompt = event;
	});
	function isInstalled() {
		return navigator.standalone === true || ['standalone', 'fullscreen', 'minimal-ui'].some(function (mode) {
			return matchMedia('(display-mode: ' + mode + ')').matches;
		});
	}
	function isIos() {
		// O iPad se apresenta como Mac.
		return /iPhone|iPad|iPod/.test(navigator.userAgent) || (/Mac/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
	}
	window.tinturboInstall = {
		// installed, prompt (o navegador instala sozinho), safari, ios (outro navegador do iPhone) ou other.
		kind: function () {
			if (isInstalled()) {
				return 'installed';
			}
			if (installPrompt) {
				return 'prompt';
			}
			if (isIos()) {
				return /CriOS|FxiOS|EdgiOS|OPiOS|OPT\/|GSA\//.test(navigator.userAgent) ? 'ios' : 'safari';
			}
			return 'other';
		},
		run: function () {
			if (installPrompt) {
				installPrompt.prompt();
				installPrompt = null;
			}
		},
	};

	// --- Diagnóstico ---

	let diagBox = null;
	let analyser = null;
	if (isDiag || isTest) {
		const connect = AudioNode.prototype.connect;
		AudioNode.prototype.connect = function (target, ...rest) {
			if (target instanceof AudioDestinationNode) {
				if (!analyser) {
					analyser = this.context.createAnalyser();
				}
				if (analyser.context === this.context) {
					connect.call(this, analyser);
				}
			}
			return connect.call(this, target, ...rest);
		};
		window.addEventListener('error', function (event) { report.error = event.message; });
	}
	if (isDiag) {
		window.addEventListener('DOMContentLoaded', toggleDiagnostics);
	}
	function beep() {
		const context = contexts[0];
		if (!context) {
			return;
		}
		context.resume();
		const tone = context.createOscillator();
		const volume = context.createGain();
		volume.gain.value = 0.4;
		tone.connect(volume);
		volume.connect(context.destination);
		tone.start();
		tone.stop(context.currentTime + 0.6);
	}
	function toggleDiagnostics() {
		if (diagBox) {
			clearInterval(diagBox.timer);
			diagBox.remove();
			diagBox = null;
			return;
		}
		const box = document.createElement('div');
		box.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:9;background:#000c;color:#fff;font:12px/1.35 monospace;padding:8px;white-space:pre-wrap;word-break:break-word';
		const text = document.createElement('div');
		const button = document.createElement('button');
		button.textContent = 'TOCAR BIP';
		button.style.cssText = 'font-size:18px;padding:8px 16px;margin-top:6px';
		button.addEventListener('click', beep);
		box.append(text, button);
		document.body.append(box);
		diagBox = box;
		box.timer = setInterval(function () {
			if (analyser) {
				const samples = new Float32Array(analyser.fftSize);
				analyser.getFloatTimeDomainData(samples);
				report.peak = Math.max(report.peak * 0.9, ...samples.map(Math.abs));
			}
			const audio = contexts.map(function (c) { return c.state + (isHealthy(c) ? '' : ' TRAVADO') + ' ' + c.sampleRate + ' t=' + c.currentTime.toFixed(1); }).join(' | ');
			text.textContent = 'Versão 2026-11-25 12:47 (test)\n' + navigator.userAgent
				+ '\nAbertura: ' + window.tinturboInstall.kind() + '  Tela: ' + innerWidth + 'x' + innerHeight + ' @' + devicePixelRatio
				+ '\nÁudio: ' + (audio || 'nenhum')
				+ '\nSessão: ' + (navigator.audioSession ? navigator.audioSession.type + ' / ' + navigator.audioSession.state : 'não existe')
				+ '\nSons: ' + report.starts + '  Pedidos: ' + report.resumes + '  Voltas: ' + report.returns + '  Destravou: ' + report.revives + '  Volume na saída: ' + report.peak.toFixed(3)
				+ '\nErro: ' + (report.error || 'nenhum');
		}, 250);
	}
}());
</script>

	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--false" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":25742192,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
